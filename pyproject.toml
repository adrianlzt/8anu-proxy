[project]
name = "8anu-proxy"
version = "0.1.0"
description = "Proxy inverso de 8a.nu"
requires-python = ">=3.13"
dependencies = [
    "brotli>=1.2.1",
    "curl-cffi>=0.17.0",
    "starlette>=0.46",
    "uvicorn>=0.34",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning:starlette.testclient"]
